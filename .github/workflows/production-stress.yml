name: Production voice stress

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL WSS do servidor que receberá a carga'
        required: true
        type: string
      duration_sec:
        description: 'Duração de cada cenário, em segundos'
        required: true
        default: '60'
        type: string
      voice_transport:
        description: 'Transporte de voz a comparar'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - quic
          - ws-dedicated
          - ws
      voice_edges:
        description: 'Edges QUIC para distribuir shards (auto ou seletores separados por vírgula)'
        required: true
        default: auto
        type: string
      confirmation:
        description: 'Digite PRODUCAO para confirmar a janela de carga'
        required: true
        type: string

concurrency:
  group: vox-production-stress
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  guard:
    name: Confirm production load
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_URL: ${{ inputs.target_url }}
          DURATION_SEC: ${{ inputs.duration_sec }}
          VOICE_EDGES: ${{ inputs.voice_edges }}
          ADMIN_TOKEN: ${{ secrets.STRESS_ADMIN_TOKEN }}
        run: |
          if [[ "$CONFIRMATION" != "PRODUCAO" ]]; then
            echo 'A carga nao foi confirmada. Digite PRODUCAO exatamente.' >&2
            exit 1
          fi
          if [[ ! "$TARGET_URL" =~ ^wss:// ]]; then
            echo 'O alvo precisa ser uma URL WSS de producao.' >&2
            exit 1
          fi
          if [[ ! "$DURATION_SEC" =~ ^[0-9]+$ ]] || (( DURATION_SEC < 5 || DURATION_SEC > 600 )); then
            echo 'A duracao precisa ser um numero entre 5 e 600 segundos.' >&2
            exit 1
          fi
          if [[ "$VOICE_EDGES" != "auto" && ! "$VOICE_EDGES" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then
            echo 'voice_edges precisa ser auto ou uma lista de seletores separados por virgula.' >&2
            exit 1
          fi
          if [[ -z "$ADMIN_TOKEN" ]]; then
            echo 'Aviso: STRESS_ADMIN_TOKEN nao foi informado; o relatorio nao tera CPU/RAM/event loop.'
          fi

  stress_50:
    name: '50 clientes · shard ${{ matrix.shard }}'
    needs: guard
    if: ${{ needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - { shard: 1, clients: 8, speakers: 2 }
          - { shard: 2, clients: 7, speakers: 1 }
          - { shard: 3, clients: 7, speakers: 1 }
          - { shard: 4, clients: 7, speakers: 1 }
          - { shard: 5, clients: 7, speakers: 1 }
          - { shard: 6, clients: 7, speakers: 1 }
          - { shard: 7, clients: 7, speakers: 1 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run production stress shard
        env:
          STRESS_CONFIRM: '1'
          STRESS_ADMIN_TOKEN: ${{ secrets.STRESS_ADMIN_TOKEN }}
          STRESS_JSON_OUT: report.json
          TARGET_URL: ${{ inputs.target_url }}
          DURATION_SEC: ${{ inputs.duration_sec }}
          VOICE_TRANSPORT: ${{ inputs.voice_transport }}
          VOICE_EDGE_LIST: ${{ inputs.voice_edges }}
          SHARD: ${{ matrix.shard }}
        run: |
          voice_edge=''
          if [[ "$VOICE_EDGE_LIST" != "auto" ]]; then
            IFS=',' read -r -a edge_list <<< "$VOICE_EDGE_LIST"
            edge_index=$(( (SHARD - 1) % ${#edge_list[@]} ))
            voice_edge="${edge_list[$edge_index]}"
          fi
          npm run stress -- \
            --url "$TARGET_URL" \
            --clients '${{ matrix.clients }}' \
            --speakers '${{ matrix.speakers }}' \
            --channels 2 \
            --duration "$DURATION_SEC" \
            --voice-profile realistic \
            --voice-transport "$VOICE_TRANSPORT" \
            --voice-edge "$voice_edge"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-stress-50-clientes-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: report.json
          if-no-files-found: warn
      - name: Cool down before the next scenario
        if: always()
        run: sleep 15

  stress_100:
    name: '100 clientes · shard ${{ matrix.shard }}'
    needs: [guard, stress_50]
    if: ${{ always() && needs.guard.result == 'success' && needs.stress_50.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { shard: 1, clients: 8, speakers: 1 }
          - { shard: 2, clients: 8, speakers: 1 }
          - { shard: 3, clients: 8, speakers: 1 }
          - { shard: 4, clients: 8, speakers: 1 }
          - { shard: 5, clients: 8, speakers: 1 }
          - { shard: 6, clients: 8, speakers: 1 }
          - { shard: 7, clients: 8, speakers: 1 }
          - { shard: 8, clients: 8, speakers: 1 }
          - { shard: 9, clients: 8, speakers: 1 }
          - { shard: 10, clients: 8, speakers: 1 }
          - { shard: 11, clients: 8, speakers: 1 }
          - { shard: 12, clients: 8, speakers: 1 }
          - { shard: 13, clients: 4, speakers: 4 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run production stress shard
        env:
          STRESS_CONFIRM: '1'
          STRESS_ADMIN_TOKEN: ${{ secrets.STRESS_ADMIN_TOKEN }}
          STRESS_JSON_OUT: report.json
          TARGET_URL: ${{ inputs.target_url }}
          DURATION_SEC: ${{ inputs.duration_sec }}
          VOICE_TRANSPORT: ${{ inputs.voice_transport }}
          VOICE_EDGE_LIST: ${{ inputs.voice_edges }}
          SHARD: ${{ matrix.shard }}
        run: |
          voice_edge=''
          if [[ "$VOICE_EDGE_LIST" != "auto" ]]; then
            IFS=',' read -r -a edge_list <<< "$VOICE_EDGE_LIST"
            edge_index=$(( (SHARD - 1) % ${#edge_list[@]} ))
            voice_edge="${edge_list[$edge_index]}"
          fi
          npm run stress -- \
            --url "$TARGET_URL" \
            --clients '${{ matrix.clients }}' \
            --speakers '${{ matrix.speakers }}' \
            --channels 4 \
            --duration "$DURATION_SEC" \
            --voice-profile realistic \
            --voice-transport "$VOICE_TRANSPORT" \
            --voice-edge "$voice_edge"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-stress-100-clientes-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: report.json
          if-no-files-found: warn
      - name: Cool down before the next scenario
        if: always()
        run: sleep 15

  stress_150:
    name: '150 clientes · shard ${{ matrix.shard }}'
    needs: [guard, stress_50, stress_100]
    if: ${{ always() && needs.guard.result == 'success' && needs.stress_50.result != 'cancelled' && needs.stress_100.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        include:
          - { shard: 1, clients: 8, speakers: 1 }
          - { shard: 2, clients: 8, speakers: 1 }
          - { shard: 3, clients: 8, speakers: 1 }
          - { shard: 4, clients: 8, speakers: 1 }
          - { shard: 5, clients: 8, speakers: 1 }
          - { shard: 6, clients: 8, speakers: 1 }
          - { shard: 7, clients: 8, speakers: 1 }
          - { shard: 8, clients: 8, speakers: 1 }
          - { shard: 9, clients: 8, speakers: 1 }
          - { shard: 10, clients: 8, speakers: 1 }
          - { shard: 11, clients: 8, speakers: 1 }
          - { shard: 12, clients: 8, speakers: 1 }
          - { shard: 13, clients: 8, speakers: 1 }
          - { shard: 14, clients: 8, speakers: 1 }
          - { shard: 15, clients: 8, speakers: 1 }
          - { shard: 16, clients: 8, speakers: 1 }
          - { shard: 17, clients: 8, speakers: 1 }
          - { shard: 18, clients: 8, speakers: 1 }
          - { shard: 19, clients: 6, speakers: 6 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run production stress shard
        env:
          STRESS_CONFIRM: '1'
          STRESS_ADMIN_TOKEN: ${{ secrets.STRESS_ADMIN_TOKEN }}
          STRESS_JSON_OUT: report.json
          TARGET_URL: ${{ inputs.target_url }}
          DURATION_SEC: ${{ inputs.duration_sec }}
          VOICE_TRANSPORT: ${{ inputs.voice_transport }}
          VOICE_EDGE_LIST: ${{ inputs.voice_edges }}
          SHARD: ${{ matrix.shard }}
        run: |
          voice_edge=''
          if [[ "$VOICE_EDGE_LIST" != "auto" ]]; then
            IFS=',' read -r -a edge_list <<< "$VOICE_EDGE_LIST"
            edge_index=$(( (SHARD - 1) % ${#edge_list[@]} ))
            voice_edge="${edge_list[$edge_index]}"
          fi
          npm run stress -- \
            --url "$TARGET_URL" \
            --clients '${{ matrix.clients }}' \
            --speakers '${{ matrix.speakers }}' \
            --channels 8 \
            --duration "$DURATION_SEC" \
            --voice-profile realistic \
            --voice-transport "$VOICE_TRANSPORT" \
            --voice-edge "$voice_edge"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-stress-150-clientes-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: report.json
          if-no-files-found: warn
      - name: Cool down before the next scenario
        if: always()
        run: sleep 15

  summary:
    name: Summarize production stress
    if: always()
    needs: [stress_50, stress_100, stress_150]
    runs-on: ubuntu-latest
    steps:
      - name: Download scenario reports
        uses: actions/download-artifact@v4
        with:
          pattern: production-stress-*
          path: reports
        continue-on-error: true
      - name: Write run summary
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = 'reports';
          const output = process.env.GITHUB_STEP_SUMMARY;
          const files = [];
          const visit = (directory) => {
            if (!fs.existsSync(directory)) return;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(file);
              else if (entry.name === 'report.json') files.push(file);
            }
          };
          visit(root);

          const groups = new Map();
          for (const file of files) {
            const folder = path.basename(path.dirname(file));
            const match = folder.match(/^production-stress-(50|100|150)-clientes-/);
            const scenario = match ? `${match[1]} clientes` : folder;
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const current = groups.get(scenario) ?? {
              requested: 0,
              active: 0,
              sent: 0,
              received: 0,
              rttP95: 0,
              cpu: null,
              rss: null,
              loop: null,
              outboundKbps: null,
              transport: { quic: 0, wsDedicated: 0, ws: 0 },
              edges: {},
              pass: true,
              reports: 0,
            };
            current.requested += report.clientsRequested ?? 0;
            current.active += report.clientsActive ?? 0;
            current.sent += report.voiceSent ?? 0;
            current.received += report.voiceReceived ?? 0;
            current.rttP95 = Math.max(current.rttP95, report.rttMs?.p95 ?? 0);
            current.pass = current.pass && report.pass === true;
            current.reports += 1;
            for (const key of ['quic', 'wsDedicated', 'ws']) {
              current.transport[key] += report.voiceTransports?.[key] ?? 0;
            }
            for (const [edge, count] of Object.entries(report.voiceEdges ?? {})) {
              current.edges[edge] = (current.edges[edge] ?? 0) + Number(count || 0);
            }
            const runtime = report.adminRuntime;
            if (runtime) {
              current.cpu = Math.max(current.cpu ?? 0, runtime.processCpuPercent ?? 0);
              current.rss = Math.max(current.rss ?? 0, runtime.memory?.rssBytes ?? 0);
              current.loop = Math.max(current.loop ?? 0, runtime.eventLoopLagP95Ms ?? 0);
              current.outboundKbps = Math.max(current.outboundKbps ?? 0, runtime.traffic?.outboundKbps ?? 0);
            }
            groups.set(scenario, current);
          }

          const order = ['50 clientes', '100 clientes', '150 clientes'];
          const formatBytes = (bytes) => bytes == null ? 'n/d' : `${(bytes / 1024 / 1024).toFixed(0)} MB`;
          const formatNumber = (value, suffix = '') => value == null ? 'n/d' : `${Number(value).toFixed(1)}${suffix}`;
          let markdown = '# Resumo do stress de produção\n\n';
          markdown += `Alvo: \`${process.env.TARGET_URL ?? 'informado no workflow'}\`\n\n`;
          markdown += '| Cenário | Ativos | Voz recebida | RTT p95 | CPU máx. | RSS máx. | Loop p95 máx. | Saída máx. | Transporte | Distribuição | Resultado |\n';
          markdown += '|---|---:|---:|---:|---:|---:|---:|---:|---|---|---|\n';
          for (const scenario of order) {
            const group = groups.get(scenario);
            if (!group) continue;
            const transport = `${group.transport.quic} QUIC / ${group.transport.wsDedicated} WS dedicado / ${group.transport.ws} WS controle`;
            const distribution = Object.entries(group.edges).map(([edge, count]) => `${edge}: ${count}`).join('<br>') || 'n/d';
            markdown += `| ${scenario} (${group.reports} shards) | ${group.active}/${group.requested} | ${group.received}/${group.sent} | ${Math.round(group.rttP95)} ms | ${formatNumber(group.cpu, '%')} | ${formatBytes(group.rss)} | ${formatNumber(group.loop, ' ms')} | ${formatNumber(group.outboundKbps, ' kbps')} | ${transport} | ${distribution} | ${group.pass ? 'PASS' : 'FAIL'} |\n`;
          }
          if (groups.size === 0) markdown += '| Nenhum relatório foi gerado | — | — | — | — | — | — | — | — | — | — |\n';
          fs.appendFileSync(output, markdown);
          NODE
