name: Vox CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vox-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-22-dependencies-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies when needed
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=2
      - name: Reuse cached dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        run: echo 'Dependências restauradas do cache; npm ci ignorado.'
      - run: npm run typecheck
      - run: npm run build

  desktop:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-22-dependencies-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies when needed
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=2
      - name: Reuse cached dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        run: echo 'Dependências restauradas do cache; npm ci ignorado.'
      - name: Build Tauri installers
        run: npm run build --workspace=@vox/desktop
      - name: Sign Windows installers (optional)
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host 'Certificado Windows não configurado; instaladores serão publicados sem assinatura.'
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'vox-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe não encontrado no runner Windows.' }
          $files = @(
            Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            Get-ChildItem packages/desktop/src-tauri/target/release/bundle/msi/*.msi
          )
          foreach ($file in $files) {
            & $signtool.FullName sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $($file.Name)." }
          }
          Remove-Item -LiteralPath $certificate -Force
      - name: Normalize download names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-downloads | Out-Null
          $exe = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw 'Tauri não gerou os instaladores Windows esperados.' }
          Copy-Item $exe.FullName desktop-downloads/v0x-windows-x64-setup.exe
          Copy-Item $msi.FullName desktop-downloads/v0x-windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: v0x-windows-downloads
          path: desktop-downloads
          if-no-files-found: error

  deploy:
    name: Deploy VPS
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Update Vox on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /opt/vox

          old_head="$(git rev-parse HEAD)"
          GIT_SSH_COMMAND="ssh -i /root/.ssh/github_vox -o IdentitiesOnly=yes" git pull --ff-only origin master
          new_head="$(git rev-parse HEAD)"

          # npm ci remove/recria node_modules e pode ficar preso no registry.
          # So reinstala quando os manifests mudarem ou quando a instalacao
          # anterior nao deixou o marcador de sucesso.
          install_stamp="node_modules/.vox-install-ok"
          package_hash="$(sha256sum package.json package-lock.json packages/*/package.json | sha256sum | awk '{print $1}')"
          manifests_changed=false
          if [ "$old_head" != "$new_head" ] && ! git diff --quiet "$old_head" "$new_head" -- package.json package-lock.json packages; then
            if git diff --name-only "$old_head" "$new_head" | grep -Eq '(^|/)(package(-lock)?\.json)$'; then
              manifests_changed=true
            fi
          fi

          if [ ! -f "$install_stamp" ] || [ "$(cat "$install_stamp")" != "$package_hash" ] || [ "$manifests_changed" = true ]; then
            npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=2
            printf '%s\n' "$package_hash" > "$install_stamp"
          else
            echo 'Dependencias inalteradas; npm ci ignorado.'
          fi

          npm run build
          systemctl restart vox.service

          # O jukebox sai com exit(1) a cada queda de socket e conta com o
          # systemd para voltar. Como todo deploy reinicia o vox.service, ele
          # cai junto e pode estourar o limite de reinicios enquanto o servidor
          # sobe — indo parar em 'failed', de onde nao sai sozinho.
          #
          # A checagem antiga era `is-active`, entao um jukebox caido nunca era
          # religado: o deploy so dizia "inativo" e seguia. Agora ele e tratado
          # sempre que o unit existir, com o estado de falha limpo antes.
          unit=/etc/systemd/system/vox-music-jukebox.service
          if [ -f "$unit" ]; then
            if ! cmp -s docs/vox-music-jukebox.service "$unit"; then
              cp "$unit" "$unit.bak"
              cp docs/vox-music-jukebox.service "$unit"
              systemctl daemon-reload
              echo "Unit do jukebox atualizado a partir do repositorio (backup em $unit.bak)."
            fi
            systemctl enable vox-music-jukebox.service >/dev/null 2>&1 || true
            systemctl reset-failed vox-music-jukebox.service >/dev/null 2>&1 || true
            systemctl restart vox-music-jukebox.service || true
            echo "Jukebox: $(systemctl is-active vox-music-jukebox.service)"
          else
            echo 'Jukebox nao instalado nesta maquina; nada a fazer.'
          fi
          REMOTE

  # Os instaladores vao para as releases de pedrogiampietro/v0x-desktop, e nao
  # mais para /downloads na VPS. Dois motivos, os dois sobre o aviso
  # "normalmente nao e baixado" do Chrome, que e reputacao:
  #
  #   1. Reputacao de origem: github.com tem, um dominio novo nao tem.
  #   2. Reputacao de arquivo: publicar a cada push trocava o binario (e o
  #      hash) em todo deploy, entao ele nascia desconhecido toda vez e nunca
  #      acumulava nada. Agora so sai release quando a versao muda.
  #
  # Nada disso substitui assinar o binario, que e o unico caminho deterministico.
  publish-desktop:
    name: Publish Windows release
    needs: [deploy, desktop]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v0x-windows-downloads
          path: desktop-downloads
      - name: Read desktop version
        id: version
        run: |
          version="$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")"
          if [ -z "$version" ]; then echo 'versao do desktop vazia' >&2; exit 1; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Detect desktop version bump
        id: version_change
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          changed=false
          zero='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = 'push' ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "$zero" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$EVENT_BEFORE" "$GITHUB_SHA" -- packages/desktop/src-tauri/tauri.conf.json; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Alteracao de versao do desktop neste push: $changed"
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'DESKTOP_RELEASE_TOKEN ausente: os botoes de download do site apontam para as releases e ficariam quebrados.' >&2
            echo 'Crie um token com contents:write em pedrogiampietro/v0x-desktop e salve como secret.' >&2
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CHANGED: ${{ steps.version_change.outputs.changed }}
          TARGET_REPO: pedrogiampietro/v0x-desktop
        run: |
          cd desktop-downloads
          # O hash e a unica forma de quem baixa conferir o que recebeu,
          # enquanto o binario nao for assinado.
          sha256sum v0x-windows-x64-setup.exe v0x-windows-x64.msi > SHA256SUMS.txt
          cat SHA256SUMS.txt

          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            if [ "$VERSION_CHANGED" = 'true' ]; then
              echo "A versao $TAG foi alterada neste push, mas a release ja existe em $TARGET_REPO." >&2
              echo 'Nao reutilize uma versao publicada; aumente a versao do desktop e faca um novo push.' >&2
              exit 1
            fi
            echo "Release $TAG ja existe; nada a publicar."
            echo 'Nenhuma versao do desktop foi alterada; release mantida.'
            exit 0
          fi

          notes="$(printf 'Cliente desktop do v0x para Windows.\n\nConfira o download com o SHA256SUMS.txt anexado.\nO site fica em https://v0x.online\n')"
          gh release create "$TAG" \
            --repo "$TARGET_REPO" \
            --title "v0x $TAG" \
            --notes "$notes" \
            v0x-windows-x64-setup.exe v0x-windows-x64.msi SHA256SUMS.txt
