name: Vox CI/CD

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: vox-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy VPS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Update Vox on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'cd /opt/vox && GIT_SSH_COMMAND="ssh -i /root/.ssh/github_vox -o IdentitiesOnly=yes" git pull --ff-only origin master && npm ci && npm run build && systemctl restart vox.service'
