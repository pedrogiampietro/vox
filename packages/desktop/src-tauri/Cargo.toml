[package]
name = "vox-desktop"
version = "0.1.0"
description = "Cliente desktop do Vox"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# Binario pequeno importa: o ponto do Tauri e nao virar um Electron.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
