[package]
name = "vox-voice-quic"
version = "0.1.0"
edition = "2021"
description = "Terminador WebTransport QUIC do v0x"
license = "UNLICENSED"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
wtransport = "0.7.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
